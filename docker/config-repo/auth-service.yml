server:
  port: 8085

spring:

  datasource:
    url: jdbc:sqlserver://sqlserver:1433;databaseName=auth_db;encrypt=false
    username: sa
    password: YourStrong@Pass123

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

eureka:
  instance:
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/