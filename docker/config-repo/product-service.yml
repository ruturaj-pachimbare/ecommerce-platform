server:
  port: 8081

spring:
  application:
    name: product-service

  datasource:
    #url: jdbc:sqlserver://localhost:1433;databaseName=product_db;encrypt=false
    url: jdbc:sqlserver://sqlserver:1433;databaseName=product_db;encrypt=false
    username: sa
    password: YourStrong@Pass123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      #defaultZone: http://localhost:8761/eureka/
      defaultZone: http://discovery-service:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"