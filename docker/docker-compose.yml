services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Pass123"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

  discovery-service:
    image: discovery-service:v1
    container_name: discovery-service

    ports:
      - "8761:8761"

  config-server:
    image: config-server:v1
    container_name: config-service

    ports:
      - "8888:8888"

    volumes:
      - ./config-repo:/config-repo

    depends_on:
      - discovery-service

  product-service:
    image: product-service:v1
    container_name: product-service

    ports:
      - "8081:8081"

    depends_on:
      - sqlserver
      - discovery-service
      - config-server


  api-gateway:
    image: api-gateway:v1
    container_name: api-gateway

    ports:
      - "8080:8080"

    depends_on:
      - discovery-service
      - config-server


  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    # Ensures container health status reflects broker state
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s # Gives the KRaft Metadata loader room to initialize

  order-service:
    image: order-service:v1
    container_name: order-service
    ports:
      - "8082:8082"
    depends_on:
      sqlserver:
        condition: service_started
      discovery-service:
        condition: service_started
      config-server:
        condition: service_started
      kafka:
        condition: service_healthy # Will hold boot block until Kafk

  inventory-service:

    image: inventory-service:v1

    container_name: inventory-service

    ports:
      - "8083:8083"

    depends_on:
      sqlserver:
        condition: service_started
      discovery-service:
        condition: service_started
      config-server:
        condition: service_started
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  notification-service:

    image: notification-service:v1

    container_name: notification-service

    ports:
      - "8084:8084"

    depends_on:
      sqlserver:
        condition: service_started
      discovery-service:
        condition: service_started
      config-server:
        condition: service_started
      kafka:
        condition: service_healthy

  auth-service:

      image: auth-service:v1

      container_name: auth-service

      ports:
        - "8085:8085"

      depends_on:
        sqlserver:
          condition: service_started
        discovery-service:
          condition: service_started
        config-server:
          condition: service_started

volumes:
  sqlserver_data: